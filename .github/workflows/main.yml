name: Run Tests and Lint

on: [push]

jobs:
  lint-job:
    name: Linting Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v6.0.2
      - name: Set Up UV
        uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync 
      - run: uv run ruff check
  test-job:
    name: Testing Job
    runs-on: ubuntu-latest
    needs:
      - lint-job
    steps:
      - name: Checkout code 
        uses: actions/checkout@v6.0.2
      - name: Set Up UV
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync
      - name: Run Tests
        run: uv run pytest
  
