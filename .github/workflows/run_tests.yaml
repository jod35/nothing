name: Run Tests With Pytest In Uv

on: [push]

jobs:
  test_job:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set Up Uv
      uses: astral-sh/setup-uv
      with:
        python-version: 3.14
    - name: Install Dependencies
      run: uv sync --no-dev
    - name: Run Tests
      run: uv run pytest